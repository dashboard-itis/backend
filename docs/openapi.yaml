components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-03-12T12:00:00Z"
            status: 400
            error: INVALID_QUERY
            message: "Page must be >= 0, size must be between 1 and 100"
            path: "/users"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-03-12T12:00:00Z"
            status: 401
            error: UNAUTHORIZED
            message: "Missing or invalid authentication token"
            path: "/users"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-03-12T12:00:00Z"
            status: 403
            error: FORBIDDEN
            message: "Insufficient permissions to access this resource"
            path: "/users/1"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-03-12T12:00:00Z"
            status: 404
            error: USER_NOT_FOUND
            message: "User with id 123 does not exist"
            path: "/users/123"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            emailExists:
              value:
                timestamp: "2026-03-12T12:00:00Z"
                status: 409
                error: EMAIL_ALREADY_EXISTS
                message: "User with this email already exists"
                path: "/users"
            groupExists:
              value:
                timestamp: "2026-03-12T12:00:00Z"
                status: 409
                error: GROUP_ALREADY_EXISTS
                message: "Group with this name already exists"
                path: "/groups"
            streamExists:
              value:
                timestamp: "2026-03-12T12:00:00Z"
                status: 409
                error: STREAM_ALREADY_EXISTS
                message: "Stream for this group, semester and year already exists"
                path: "/streams"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-03-12T12:00:00Z"
            status: 500
            error: INTERNAL_SERVER_ERROR
            message: "An unexpected error occurred"
            path: "/users"

  schemas:
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-03-12T12:00:00Z"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: INVALID_QUERY
        message:
          type: string
          example: "Page must be >= 0"
        path:
          type: string
          example: "/users"
      required: [timestamp, status, error, message, path]

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: student@university.edu
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        role:
          type: string
          enum: [STUDENT, CURATOR, ADMIN]
          example: STUDENT
        groupId:
          type: integer
          nullable: true
          example: 3
        createdAt:
          type: string
          format: date-time
          example: "2026-01-15T10:30:00Z"
      required: [id, email, firstName, lastName, role, createdAt]

    CreateUserRequest:
      type: object
      required: [email, password, firstName, lastName, role]
      properties:
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 100
          example: student@university.edu
        password:
          type: string
          format: password
          minLength: 8
          example: securePass123
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          example: John
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          example: Doe
        role:
          type: string
          enum: [STUDENT, CURATOR, ADMIN]
          example: STUDENT
        groupId:
          type: integer
          nullable: true
          example: 3

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: student@university.edu
        password:
          type: string
          format: password
          minLength: 8
          example: newSecurePass123
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          example: John
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          example: Doe
        role:
          type: string
          enum: [STUDENT, CURATOR, ADMIN]
          example: STUDENT
        groupId:
          type: integer
          nullable: true
          example: 3

    UserPage:
