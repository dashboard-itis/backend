          in: query
          description: Filter by name
          schema:
            type: string
            example: "Mathematics"
        - name: groupId
          in: query
          description: Filter by group
          schema:
            type: integer
            example: 1
        - name: teacherId
          in: query
          description: Filter by teacher
          schema:
            type: integer
            example: 10
        - name: semester
          in: query
          description: Filter by semester
          schema:
            type: string
