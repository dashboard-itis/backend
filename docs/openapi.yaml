          schema:
            type: integer
            minimum: 1
            maximum: 2
            example: 1
        - name: year
          in: query
          description: Filter by year
          schema:
            type: integer
            example: 2026
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: ordering
          in: query
