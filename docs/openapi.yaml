openapi: 3.0.3
info:
  title: Academic Performance API
  description: API for student academic performance tracking system
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Local development server

tags:
  - name: Users
    description: User management
  - name: Groups
    description: Academic groups management
  - name: Streams
    description: Streams and semesters management
  - name: Courses
    description: Courses management
  - name: Assignments
    description: Assignments management
  - name: Submissions
    description: Submissions management
  - name: Grades
    description: Grades management
  - name: Attendance
    description: Attendance management
  - name: PrivacyPolicies
    description: Privacy policies management
  - name: ImportSources
    description: Import sources management
  - name: Analytics
    description: Analytics and statistics
  - name: Auth
    description: Authentication

paths:
  /auth/token:
    post:
      tags: [Auth]
      summary: Get access token
      description: OAuth2 password flow for obtaining JWT token with role-based scopes
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - username
                - password
                - grant_type
              properties:
                grant_type:
                  type: string
                  enum: [password]
                  example: password
                username:
                  type: string
                  format: email
                  example: curator@university.edu
                password:
                  type: string
                  format: password
                  example: securePass123
                scope:
                  type: string
                  example: "student curator"
      responses:
        "200":
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 86400
                  refresh_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  scope:
                    type: string
                    example: "student curator"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - refresh_token
                - grant_type
              properties:
                grant_type:
                  type: string
                  enum: [refresh_token]
                  example: refresh_token
                refresh_token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "200":
          description: Token successfully refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

