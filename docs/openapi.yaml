            example: "CS-2026"
        - name: year
          in: query
          description: Filter by year
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
            example: 2026
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: ordering
          in: query
          schema:
            type: string
            enum: [name, -name, year, -year]
            example: -year
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupPage"
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

    post:
