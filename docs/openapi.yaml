openapi: 3.0.3
info:
  title: Academic Performance API
  description: API for student academic performance tracking system
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Local development server
  - url: https://api.academic.edu/v1
    description: Production server

tags:
  - name: Users
    description: User management
  - name: Groups
    description: Academic groups management
  - name: Streams
    description: Streams and semesters management
  - name: Courses
    description: Courses management
  - name: Assignments
    description: Assignments management
  - name: Submissions
    description: Submissions management
  - name: Grades
    description: Grades management
  - name: Attendance
    description: Attendance management
  - name: PrivacyPolicies
    description: Privacy policies management
  - name: ImportSources
    description: Import sources management
  - name: Analytics
    description: Analytics and statistics
  - name: Auth
    description: Authentication

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: User login
      description: Get JWT token for API access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: curator@university.edu
                password:
                  type: string
                  format: password
                  example: securePass123
      responses:
        "200":
          description: Successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  expiresIn:
                    type: integer
                    example: 86400
        "401":
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      summary: Get users list
      description: Returns paginated list of users with filtering
      parameters:
        - name: role
          in: query
          description: Filter by role
          schema:
            type: string
            enum: [STUDENT, CURATOR, ADMIN]
            example: STUDENT
        - name: groupId
          in: query
          description: Filter by group ID
          schema:
            type: integer
            example: 3
        - name: search
          in: query
          description: Search by name or email
          schema:
            type: string
            example: "John"
        - name: page
          in: query
          description: Page number (zero-based)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Page size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: ordering
          in: query
          description: Sorting
          schema:
            type: string
            enum: [created_at, -created_at, email, -email, lastName, -lastName]
            example: -created_at
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Users]
      summary: Create new user
      description: Creates a new user in the system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Users]
      summary: Update user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [Users]
      summary: Delete user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        "204":
          description: User deleted
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

