components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        password:
          tokenUrl: /auth/token
          refreshUrl: /auth/refresh
          scopes:
            student: "Access to own data and anonymized group statistics"
            curator: "Access to aggregated group metrics and anonymized ratings"
            admin: "Full access to all functions"

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
                example: "2026-03-12T12:00:00Z"
              status:
                type: integer
                example: 422
              errors:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      example: "page"
                    message:
                      type: string
                      example: "must be greater than or equal to 0"
                    rejected_value:
                      type: any
                      example: -1
              path:
                type: string
                example: "/users"
            required: [timestamp, status, errors, path]

    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-03-12T12:00:00Z"
            status: 400
            error: INVALID_REQUEST
            message: "Malformed request syntax"
            path: "/users"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-03-12T12:00:00Z"
            status: 401
            error: UNAUTHORIZED
            message: "Missing or invalid authentication token"
            path: "/users"

    Forbidden:
      description: Access forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-03-12T12:00:00Z"
            status: 403
            error: FORBIDDEN
            message: "Insufficient scope. Required: admin"
            path: "/users/1"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-03-12T12:00:00Z"
            status: 404
            error: USER_NOT_FOUND
            message: "User with id 123 does not exist"
            path: "/users/123"

    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            emailExists:
              value:
                timestamp: "2026-03-12T12:00:00Z"
                status: 409
                error: EMAIL_ALREADY_EXISTS
                message: "User with this email already exists"
                path: "/users"
            groupExists:
              value:
                timestamp: "2026-03-12T12:00:00Z"
                status: 409
                error: GROUP_ALREADY_EXISTS
                message: "Group with this name already exists"
                path: "/groups"
            streamExists:
              value:
                timestamp: "2026-03-12T12:00:00Z"
                status: 409
                error: STREAM_ALREADY_EXISTS
                message: "Stream for this group, semester and year already exists"
                path: "/streams"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-03-12T12:00:00Z"
            status: 500
            error: INTERNAL_SERVER_ERROR
            message: "An unexpected error occurred"
            path: "/users"

