        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [PENDING, SUBMITTED, GRADED]
            example: SUBMITTED
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: ordering
          in: query
          schema:
            type: string
