  /assignments:
    get:
      tags: [Assignments]
      summary: Get assignments list
      parameters:
        - name: courseId
          in: query
          description: Filter by course
          schema:
            type: integer
            example: 101
        - name: teacherId
          in: query
          description: Filter by teacher
          schema:
            type: integer
            example: 10
        - name: dueDateBefore
          in: query
          description: Assignments due before date
          schema:
            type: string
            format: date-time
            example: "2026-03-20T23:59:59Z"
        - name: dueDateAfter
          in: query
          description: Assignments due after date
          schema:
            type: string
            format: date-time
            example: "2026-03-01T00:00:00Z"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: ordering
          in: query
          schema:
            type: string
            enum: [dueDate, -dueDate, created_at, -created_at, title, -title]
            example: -dueDate
      responses:
